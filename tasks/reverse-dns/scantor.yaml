# yaml-language-server: $schema=https://raw.githubusercontent.com/lonetis/scantor/main/schemas/task-manifest.schema.json
scantor: 1
name: reverse-dns
language: go
description: Reverse DNS (PTR) lookup of every address of CIDR ranges.
defaults:
  processes: 4
  timeout: 30s
  resources:
    cpus: 0.25
    memory: 128MiB
