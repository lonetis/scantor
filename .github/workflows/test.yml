# Lint, type checks, unit suites and the dockerized e2e suite (docs/testing.md §12). Every job calls
# the same just recipes developers run. On main, the `latest` job then tags the commit's images (pushed
# as sha-<short> by images.yml) latest, so latest only ever names tested images.
name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.59.0
      - run: just lint
      - run: just typecheck
      - run: just docs --check
      - run: just test-index --check

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [go, go-integration, orchestrator, orchestrator-integration, connectors, conformance]
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.59.0
      - uses: docker/setup-buildx-action@v4
      # The COMMIT build argument of the justfile's bake (`git rev-parse --short HEAD`): with the same value
      # here, the images below match the e2e job's cache and the builds of the recipes.
      - name: Commit
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      # The Go integration tests use the dev-tagged scantor and base images and never build them
      # (reading the build cache the e2e job writes).
      - name: Images of the Go integration tests
        if: matrix.suite == 'go-integration'
        uses: docker/bake-action@v7
        env:
          COMMIT: ${{ steps.commit.outputs.short }}
        with:
          source: .
          targets: scantor,base-python,base-js,base-go
          load: true
          set: |
            scantor.cache-from=type=gha,scope=test-scantor
            base-python.cache-from=type=gha,scope=test-base-python
            base-js.cache-from=type=gha,scope=test-base-js
            base-go.cache-from=type=gha,scope=test-base-go
      # The helper and task build tests of the orchestrator run the dev-tagged scantor image, which the recipe
      # bakes; this step fills the builder's cache from the e2e job's.
      - name: Image of the orchestrator integration tests
        if: matrix.suite == 'orchestrator-integration'
        uses: docker/bake-action@v7
        env:
          COMMIT: ${{ steps.commit.outputs.short }}
        with:
          source: .
          targets: scantor
          load: true
          set: |
            scantor.cache-from=type=gha,scope=test-scantor
      - name: Service images of the Go integration tests
        if: matrix.suite == 'go-integration'
        run: |
          docker pull rabbitmq:4.4-management
          docker pull registry:3.1.2
      - run: just test-${{ matrix.suite }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # The images, their tarballs, the runner's cache volume and the task images of the suite need about
      # 40 GB: drop the preinstalled toolchains and keep Docker's data on the larger /mnt disk when there is one.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force >/dev/null
          if mountpoint -q /mnt && [ "$(df --output=avail -k /mnt | tail -n 1)" -gt "$(df --output=avail -k / | tail -n 1)" ]; then
            sudo systemctl stop docker.socket docker
            sudo mkdir -p /mnt/docker
            config=/etc/docker/daemon.json
            if [ -s "$config" ]; then current="$(sudo cat "$config")"; else current='{}'; fi
            jq '. + {"data-root": "/mnt/docker"}' <<< "$current" | sudo tee "$config" >/dev/null
            sudo systemctl start docker
          fi
          df -h / /mnt
          docker info --format 'Docker data: {{.DockerRootDir}}'
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.59.0
      - uses: docker/setup-buildx-action@v4
      # The COMMIT build argument of the justfile's bake (`git rev-parse --short HEAD`), so the bake of
      # `just test-e2e` finds the runner image built below in the builder's cache instead of rebuilding it.
      - name: Commit
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      # The runner's own image cache does not survive between CI runs, so the images are built here
      # with the GitHub Actions cache and loaded into the runner; the runner image itself is cached too.
      - name: Build the test images and the runner image
        uses: docker/bake-action@v7
        env:
          COMMIT: ${{ steps.commit.outputs.short }}
        with:
          source: .
          targets: test,test-runner
          load: true
          set: |
            scantor.cache-from=type=gha,scope=test-scantor
            scantor.cache-to=type=gha,scope=test-scantor,mode=max
            orchestrator.cache-from=type=gha,scope=test-orchestrator
            orchestrator.cache-to=type=gha,scope=test-orchestrator,mode=max
            editor.cache-from=type=gha,scope=test-editor
            editor.cache-to=type=gha,scope=test-editor,mode=max
            base-python.cache-from=type=gha,scope=test-base-python
            base-python.cache-to=type=gha,scope=test-base-python,mode=max
            base-js.cache-from=type=gha,scope=test-base-js
            base-js.cache-to=type=gha,scope=test-base-js,mode=max
            base-go.cache-from=type=gha,scope=test-base-go
            base-go.cache-to=type=gha,scope=test-base-go,mode=max
            test-fixtures.cache-from=type=gha,scope=test-fixtures
            test-fixtures.cache-to=type=gha,scope=test-fixtures,mode=max
            test-runner.cache-from=type=gha,scope=test-runner
            test-runner.cache-to=type=gha,scope=test-runner,mode=max
      - run: just test-images-save
      - run: just test-e2e
        env:
          SCANTOR_TEST_IMAGES_DIR: /src/.test-images
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/playwright-report
            tests/test-results
          retention-days: 7

  # `latest` is the shipped SCANTOR_IMAGE_TAG: it moves to a main commit's images only after every job above
  # passed. The images of the commit are those images.yml pushed as sha-<short> for the same push.
  latest:
    needs: [static, unit, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      REGISTRY_PREFIX: ghcr.io/lonetis/
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for the images of this commit
        id: images
        run: |
          run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow images.yml --commit "$GITHUB_SHA" --event push \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$run" ]; then echo "::error::no images.yml run for $GITHUB_SHA"; exit 1; fi
          gh run watch "$run" --repo "$GITHUB_REPOSITORY" --interval 30 > /dev/null || true
          conclusion="$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          case "$conclusion" in
            success) ;;
            # A newer push superseded the run (images.yml queues one run per ref): its own tests move latest.
            cancelled) echo "::notice::images.yml run $run was cancelled; latest stays where it is" ;;
            *) echo "::error::images.yml run $run concluded '$conclusion'"; exit 1 ;;
          esac
      - uses: docker/setup-buildx-action@v4
        if: steps.images.outputs.conclusion == 'success'
      - uses: docker/login-action@v4
        if: steps.images.outputs.conclusion == 'success'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the images latest
        if: steps.images.outputs.conclusion == 'success'
        run: |
          # metadata-action's type=sha tag: sha- and the first 7 characters of the commit.
          sha="sha-${GITHUB_SHA::7}"
          for image in scantor scantor-orchestrator scantor-editor scantor-base-python scantor-base-js scantor-base-go; do
            echo "==> ${REGISTRY_PREFIX}${image}:${sha} -> latest"
            docker buildx imagetools create -t "${REGISTRY_PREFIX}${image}:latest" "${REGISTRY_PREFIX}${image}:${sha}"
          done
