# Traefik file-provider configuration of the test stack (docs/testing.md §7.3, docs/deployment.md §7.4):
# the entrypoint copies it next to the throwaway test CA's wildcard certificate for scantor.localhost and
# *.scantor.localhost, and Traefik serves that certificate as its default.
tls:
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/dynamic/wildcard.crt
        keyFile: /etc/traefik/dynamic/wildcard.key
